name: Validate character contributions

on:
  pull_request:
    paths:
      - "characters/**"
      - "swingly/public/characters/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10

      - name: Install dependencies
        working-directory: skills/page-swingly
        run: uv sync

      - name: Validate characters
        working-directory: skills/page-swingly
        run: uv run page-swingly-validate
