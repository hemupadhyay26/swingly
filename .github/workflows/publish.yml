name: Publish swingly to npm

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: swingly/package-lock.json

      - name: Install dependencies
        working-directory: swingly
        run: npm ci

      - name: Typecheck
        working-directory: swingly
        run: npm run typecheck

      - name: Build
        working-directory: swingly
        run: npm run build

      - name: Set version from tag
        working-directory: swingly
        # The pushed tag (e.g. v1.0.0) is the single source of truth for the
        # published version - no local `npm version` bump needed beforehand.
        # This only rewrites package.json in this CI checkout for the
        # publish step below; it isn't committed back to the repo, so the
        # committed package.json can drift from what's actually on npm.
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"

      - name: Publish to npm
        working-directory: swingly
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
